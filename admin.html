<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – FW Kasse</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    html, body { overflow: auto; height: auto; -webkit-user-select: auto; user-select: auto; }
    body { display: block; padding: 16px; font-size: max(16px, var(--fs-base)); }
    #configForm { max-width: 720px; margin: 0 auto; }
    #configForm input, #configForm button {
      font-size: max(16px, var(--fs-base));
      min-height: 44px;
      padding: 0 10px;
    }
    #configForm button { min-width: 44px; }
    .field { display: flex; flex-direction: column; margin-bottom: .75rem; }
    .field label { font-size: var(--fs-sm); margin-bottom: .25rem; }
    .actions { display: flex; justify-content: space-between; gap: .5rem; margin-top: 1rem; }
    .actions a { color: #fff; align-self: center; }
    .art-row { display: flex; gap: .25rem; align-items: center; margin-bottom: .25rem; flex-wrap: nowrap; }
    .art-row input[data-f="name"], .art-head .h-name { flex: 2; min-width: 0; }
    .art-row input[type="number"], .art-head .h-num { flex: 1; width: 4.5rem; min-width: 0; }
    .art-head { display: flex; gap: .25rem; font-size: var(--fs-sm); color: #ccc; margin-bottom: .25rem; }
    .art-head .h-btn { width: 11.5rem; }
    .art-row hr { flex: 1; }
    .art-bar { display: flex; gap: .5rem; margin-top: .5rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <form id="configForm">
    <h1>Konfiguration</h1>

    <div class="field">
      <label for="adminPin">Admin-PIN</label>
      <input id="adminPin" name="adminPin" type="password" inputmode="numeric" autocomplete="off">
    </div>

    <div class="field">
      <label>Artikel</label>
      <div class="art-head">
        <span class="h-name">Name</span>
        <span class="h-num">Preis (€)</span>
        <span class="h-num">Pfand (€)</span>
        <span class="h-btn"></span>
      </div>
      <div id="articleList"></div>
    </div>

    <div class="actions">
      <a href="./index.html" id="backLink">← Zurück zur Kasse</a>
      <button type="submit" id="saveConfig">Speichern</button>
    </div>
  </form>

  <script src="./articles.js"></script>
  <script src="./store.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
