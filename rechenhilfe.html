<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c69d4">
  <meta name="apple-mobile-web-app-title" content="Kasse">
  <title>FW Kassentool – Rechenhilfe</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
  <style>
    #calc {
      flex: 2; display: flex; flex-direction: column; gap: var(--gap);
      padding: var(--gap) var(--pad); min-width: 0;
    }
    .nav { display: flex; gap: var(--gap); }
    .nav a {
      font-size: var(--fs-base); padding: 0 var(--pad);
      min-height: var(--btn);
      display: flex; align-items: center;
      border-radius: 12px; background: #1c69d4;
      color: #fff; text-decoration: none;
    }
    .nav a:active { opacity: .6; }
    .info { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
    .box { background: #1b1e21; border-radius: 12px; padding: calc(var(--gap) * .6) var(--pad); min-width: 0; }
    .box small { color: #aaa; font-size: var(--fs-sm); display: block; }
    .box div { font-size: var(--fs-xl); text-align: right; white-space: nowrap; overflow: hidden; }
    .box.change div { color: #5fd38a; }
    .box.change.neg div { color: #ff6b6b; }

    /* Tastenraster 5 x 4 */
    #keys {
      flex: 1; display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: calc(var(--gap) * .7);
      min-height: 0;
    }
    #keys button, #keys a {
      font-size: var(--fs-xl); border: 0; border-radius: 12px;
      background: #3a3f44; color: #fff; padding: 0; min-height: 0;
    }
    #keys button.clr { background: #c0392b; }
    #keys button.fix { background: #1c69d4; }
    #keys button.exact { background: #e08a00; font-size: var(--fs-base); }
    #keys button.exact.active { background: #ffb340; color: #000; }
    #keys button.small { font-size: var(--fs-base); }
    #keys a#done {
      display: flex; align-items: center; justify-content: center;
      background: #2e9e4f; text-decoration: none; text-align: center;
      font-size: var(--fs-lg);
    }
    #keys button:active, #keys a:active { opacity: .6; }

    /* Hinweis im Hochformat */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: #2b2f33; color: #fff;
      align-items: center; justify-content: center;
      text-align: center; font-size: var(--fs-xl); padding: 24px;
    }
    @media (orientation: portrait) {
      #rotate { display: flex; }
    }

    /* Schmale Displays (Handy quer) */
    @media (max-width: 800px) {
      #calc { flex: 3; }
      #receipt { flex: 2; }
    }
    @media (max-height: 480px) {
      .nav a { min-height: 40px; }
      .box div { font-size: var(--fs-lg); }
    }
  </style>
</head>
<body>
  <div id="rotate">Bitte das Gerät quer halten ↻</div>

  <section id="calc">
    <div class="nav">
      <a id="back" href="index.html">← Zurück zur Bestellung</a>
    </div>

    <div class="info">
      <div class="box"><small>Zu zahlen</small><div id="due">0,00 €</div></div>
      <div class="box"><small>Gegeben</small><div id="given">0,00 €</div></div>
      <div class="box change" id="chBox"><small id="chLabel">Rückgeld</small><div id="change">0,00 €</div></div>
    </div>

    <div id="keys"></div>
  </section>

  <aside id="receipt">
    <h2>ZUSAMMENFASSUNG</h2>
    <div id="lines"></div>
    <div class="sub" id="subOrder"></div>
    <div id="pfandBox"></div>
    <div class="sub" id="subPfand"></div>
    <div id="total"><span>SUMME</span><span id="sum">0,00 €</span></div>
  </aside>

  <script src="articles.js"></script>
  <script src="store.js"></script>
  <script src="shared.js"></script>
  <script>
    let input = ''; // Eingabe als Text, z. B. "20,5"
    let exactMode = false; // true, wenn der Betrag per "Passend" gesetzt wurde
    let exactBtn = null;

    const givenEl = document.getElementById('given');
    const changeEl = document.getElementById('change');
    const chBox = document.getElementById('chBox');
    const chLabel = document.getElementById('chLabel');
    const keysEl = document.getElementById('keys');

    // Zusammenfassung und Betrag aus den gespeicherten Mengen
    const due = renderSummary(loadArr('fwQty'), loadArr('fwDep'));
    document.getElementById('due').textContent = fmt(due);

    // Tasten: Spalte 1 = Scheine, Spalten 2-4 = Ziffern und Funktionen
    [ '5 €', '7', '8', '9',
      '10 €', '4', '5', '6',
      '20 €', '1', '2', '3',
      '50 €', '0', ',', '⌫',
      '100 €', 'Passend', 'C'
    ].forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      if (k === 'C') b.className = 'clr';
      if (k.includes('€')) b.className = 'fix';
      if (k === 'Passend') { b.className = 'exact'; exactBtn = b; }
      b.addEventListener('click', () => press(k));
      keysEl.appendChild(b);
    });

    // "Fertig" im letzten Feld der Matrix (Zeile 5, Spalte 4)
    const doneBtn = document.createElement('a');
    doneBtn.id = 'done';
    doneBtn.href = 'index.html';
    doneBtn.textContent = 'Fertig';
    doneBtn.addEventListener('click', clearOrder);
    keysEl.appendChild(doneBtn);

    function press(k) {
      if (k === 'C') {
        input = '';
        exactMode = false;
      } else if (k === '⌫') {
        input = input.slice(0, -1);
        exactMode = false;
      } else if (k === 'Passend') {
        if (exactMode) {
          input = '';
          exactMode = false;
        } else {
          input = due.toFixed(2).replace('.', ',');
          exactMode = true;
        }
      } else if (k.includes('€')) {
        // Nach "Passend" wird der Betrag überschrieben, sonst addiert
        const base = exactMode ? 0 : Math.round((parseFloat(input.replace(',', '.')) || 0) * 100);
        const sum = base + parseInt(k, 10) * 100;
        input = (sum % 100 === 0)
          ? String(sum / 100)
          : (sum / 100).toFixed(2).replace('.', ',');
        exactMode = false;
      } else if (k === ',') {
        if (!input.includes(',')) input = (input || '0') + ',';
        exactMode = false;
      } else {
        const dec = input.split(',')[1];
        if (dec !== undefined && dec.length >= 2) return;
        if (input.replace(',', '').length >= 7) return;
        input += k;
        exactMode = false;
      }
      update();
    }

    function update() {
      exactBtn.classList.toggle('active', exactMode);
      const given = parseFloat(input.replace(',', '.')) || 0;
      const diff = Math.round((given - due) * 100) / 100;
      givenEl.textContent = input ? input + ' €' : fmt(0);
      if (diff >= 0) {
        chLabel.textContent = 'Rückgeld';
        chBox.classList.remove('neg');
        changeEl.textContent = fmt(diff);
      } else {
        chLabel.textContent = 'Noch offen';
        chBox.classList.add('neg');
        changeEl.textContent = fmt(-diff);
      }
    }
    update();

    lockGestures('#lines');
    keepAwake();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
